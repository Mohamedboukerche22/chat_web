<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Enhanced Messenger Chat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .header {
            margin-bottom: 20px;
            position: relative;
            text-align: center;
        }
        
        .header h2 {
            color: #1877f2;
            font-size: 28px;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .status-badge {
            background: #4CD964;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            box-shadow: 0 0 5px rgba(76, 217, 100, 0.5);
        }
        
        #chat-container {
            width: 100%;
            max-width: 500px;
            height: 80vh;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #1877f2, #0a5bc4);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .chat-header h3 {
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        
        .chat-header .options i {
            margin-left: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .chat-header .options i:hover {
            transform: scale(1.1);
        }
        
        #messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f0f2f5;
            scroll-behavior: smooth;
        }
        
        #messages {
            list-style-type: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message-wrapper {
            display: flex;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        
        .sent-wrapper {
            justify-content: flex-end;
        }
        
        .received-wrapper {
            justify-content: flex-start;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-break: break-word;
            position: relative;
            line-height: 1.4;
        }
        
        .message.sent {
            background: linear-gradient(135deg, #0084ff, #0099ff);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message.received {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .message-sender {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
            opacity: 0.8;
        }
        
        .message-time {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.7;
            display: block;
            text-align: right;
        }
        
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
        }
        
        form {
            display: flex;
            align-items: center;
        }
        
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: none;
            background: #f0f2f5;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        
        input:focus {
            background: #e4e6eb;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }
        
        .emoji-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #1877f2;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }
        
        .emoji-btn:hover {
            transform: translateY(-50%) scale(1.1);
        }
        
        button.send-btn {
            background: #1877f2;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        button.send-btn:hover {
            background: #166fe5;
            transform: scale(1.05);
        }
        
        button.send-btn:active {
            transform: scale(0.95);
        }
        
        button.send-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: none;
            padding: 8px 15px;
            background: rgba(0,0,0,0.05);
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            align-self: flex-start;
            animation: fadeIn 0.3s;
        }
        
        .typing-indicator.active {
            display: inline-block;
        }
        
        .typing-user {
            font-weight: bold;
        }
        
        .typing-dots {
            display: inline-block;
            margin-left: 4px;
        }
        
        .typing-dots span {
            width: 5px;
            height: 5px;
            background: #666;
            display: inline-block;
            border-radius: 50%;
            margin: 0 1px;
            animation: pulse 1.5s infinite;
        }
        
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        .connection-status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .connection-status.show {
            opacity: 1;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        
        /* Scrollbar styling */
        #messages-container::-webkit-scrollbar {
            width: 6px;
        }
        
        #messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        #messages-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        #messages-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        @media (max-width: 600px) {
            #chat-container {
                height: 85vh;
                border-radius: 12px;
            }
            
            .header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Enhanced Messenger <span class="status-badge"></span></h2>
    </div>
    
    <div id='chat-container'>
        <div class="chat-header">
            <h3>Group Chat</h3>
            <div class="options">
                <i class="fas fa-users" title="Participants"></i>
                <i class="fas fa-cog" title="Settings"></i>
            </div>
        </div>
        
        <div id="messages-container">
            <ul id='messages'></ul>
            <div class="typing-indicator" id="typingIndicator">
                <span class="typing-user" id="typingUser">Someone</span> is typing<span class="typing-dots"><span></span><span></span><span></span></span>
            </div>
        </div>
        
        <div class="input-area">
            <form id='form'>
                <div class="input-wrapper">
                    <input id='input' autocomplete='off' placeholder='Type a message...' />
                    <button type="button" class="emoji-btn" id="emojiBtn"><i class="far fa-smile"></i></button>
                </div>
                <button class="send-btn" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <div class="connection-status" id="connectionStatus">Connected</div>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js'></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM elements
            const socket = io();
            const form = document.getElementById('form');
            const input = document.getElementById('input');
            const messages = document.getElementById('messages');
            const messagesContainer = document.getElementById('messages-container');
            const typingIndicator = document.getElementById('typingIndicator');
            const typingUser = document.getElementById('typingUser');
            const sendBtn = document.getElementById('sendBtn');
            const emojiBtn = document.getElementById('emojiBtn');
            const connectionStatus = document.getElementById('connectionStatus');
            let currentUser = 'User-' + Math.floor(Math.random() * 1000);
            let isTyping = false;
            let typingTimeout;
            let lastTypingTime = 0;
            socket.on('connect', () => {
                showConnectionStatus('Connected', '#4CD964');
                console.log('Connected to server');
            });
            
            socket.on('disconnect', () => {
                showConnectionStatus('Disconnected', '#FF3B30');
            });
            
            socket.on('reconnect', () => {
                showConnectionStatus('Reconnected', '#4CD964');
            });
            
            function showConnectionStatus(text, color) {
                connectionStatus.textContent = text;
                connectionStatus.style.backgroundColor = color;
                connectionStatus.classList.add('show');
                
                setTimeout(() => {
                    connectionStatus.classList.remove('show');
                }, 3000);
            }
            
            // Message functions
            function formatTime(timestamp) {
                const date = timestamp ? new Date(timestamp) : new Date();
                let hours = date.getHours();
                let minutes = date.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; 
                minutes = minutes < 10 ? '0' + minutes : minutes;
                
                return hours + ':' + minutes + ' ' + ampm;
            }
            
            function createMessageElement(messageData) {
                const isCurrentUser = messageData.sender === currentUser;
                const type = isCurrentUser ? 'sent' : 'received';
                
                const wrapperDiv = document.createElement('div');
                wrapperDiv.className = `message-wrapper ${type}-wrapper`;
                
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                
                if (!isCurrentUser) {
                    const senderSpan = document.createElement('span');
                    senderSpan.className = 'message-sender';
                    senderSpan.textContent = messageData.sender;
                    messageDiv.appendChild(senderSpan);
                }
                
                const textNode = document.createTextNode(messageData.text);
                messageDiv.appendChild(textNode);
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'message-time';
                timeSpan.textContent = formatTime(messageData.timestamp);
                messageDiv.appendChild(timeSpan);
                
                wrapperDiv.appendChild(messageDiv);
                return wrapperDiv;
            }
            
            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
            fetch('/get_messages')
                .then(response => response.json())
                .then(data => {
                    data.forEach(msg => {
                        messages.appendChild(createMessageElement(msg));
                    });
                    scrollToBottom();
                })
                .catch(error => {
                    console.error('Error loading messages:', error);
                });
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                sendMessage();
            });
            
            sendBtn.addEventListener('click', sendMessage);
            
            function sendMessage() {
                const messageText = input.value.trim();
                if (!messageText) return;
                
                const messageData = {
                    text: messageText,
                    timestamp: new Date().toISOString(),
                    sender: currentUser
                };
                
                socket.emit('message', messageData.text);
                messages.appendChild(createMessageElement(messageData));
                scrollToBottom();
                input.value = '';
                sendBtn.disabled = true;
                resetTyping();
            }
            socket.on('new_message', function(messageData) {
                resetTyping();
                messages.appendChild(createMessageElement(messageData));
                scrollToBottom();
            });
            
            socket.on('user_typing', function(data) {
                if (data.sender === currentUser) return;
                
                typingUser.textContent = data.sender;
                
                if (data.is_typing) {
                    typingIndicator.classList.add('active');
                    scrollToBottom();
                } else {
                    typingIndicator.classList.remove('active');
                }
            });
            function updateTyping() {
                const now = Date.now();
                if (!isTyping && input.value.trim().length > 0) {
                    isTyping = true;
                    socket.emit('typing', { is_typing: true });
                }
                
                lastTypingTime = now;
                
                if (typingTimeout) clearTimeout(typingTimeout);
                typingTimeout = setTimeout(resetTyping, 2000);
            }
            
            function resetTyping() {
                const now = Date.now();
                const timeDiff = now - lastTypingTime;
                
                if (isTyping && timeDiff >= 2000) {
                    isTyping = false;
                    socket.emit('typing', { is_typing: false });
                }
            }
            input.addEventListener('input', function() {
                sendBtn.disabled = input.value.trim().length === 0;
                updateTyping();
            });
            
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            input.addEventListener('blur', resetTyping);
            emojiBtn.addEventListener('click', function() {
                input.focus();
                input.value += ' 😊';
                input.dispatchEvent(new Event('input'));
            });
            document.title = `Chat - ${currentUser}`;
        });
    </script>
</body>
</html>
